
# Configuracion de la base de datos MySQL.
# Los valores reales se pasan como variables de entorno (por ejemplo en docker-compose):
#   DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Servicio de analitica en Python (data-info) y su llave compartida: PYTHON_API_URL, PYTHON_API_KEY
python.api.url=${PYTHON_API_URL:http://localhost:8000}
python.api.key=${PYTHON_API_KEY}

# Seguridad
# JWT_SECRET: texto de al menos 32 caracteres. Si no se define, se genera una llave al arrancar
#             (las sesiones se pierden en cada reinicio).
# ADMIN_EMAILS: correos con acceso al panel de administracion, separados por coma.
app.jwt.secret=${JWT_SECRET:}
app.admin.emails=${ADMIN_EMAILS:}

